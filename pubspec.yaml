name: benesnap
description: "Cosmetics shop kiosk and catalogue manager for desktop."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management. Hand-written providers only — no riverpod_generator,
  # see the dev_dependencies comment below.
  flutter_riverpod: ^3.3.2

  # Routing
  go_router: ^17.4.0

  # Persistence.
  # `sqlite3` 3.x bundles the native library via Dart build hooks; its
  # predecessor `sqlite3_flutter_libs` is retired (latest is `0.6.0+eol`).
  drift: ^2.34.3
  sqlite3: ^3.5.1
  path: ^1.9.1
  path_provider: ^2.1.6

  # Auth
  bcrypt: ^1.1.3

  # Desktop shell and file handling
  window_manager: ^0.5.2
  file_picker: ^11.0.3
  desktop_drop: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # 2.15.2+ needs analyzer >=13.3.0, which needs meta ^1.18.3 — one patch ahead
  # of what this Flutter SDK pins (1.18.0).
  build_runner: ^2.15.1
  # 2.34.1+ needs analyzer ^13.0.0. riverpod (a normal dependency of
  # flutter_riverpod) pulls in package:test, and the only `test` release built
  # against analyzer 13.x pins test_api to 0.7.13 — one patch ahead of what
  # this Flutter SDK's flutter_test bundles (0.7.11). 2.34.0 is the newest
  # release still on analyzer <13.
  drift_dev: ">=2.33.0 <2.34.1"

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/ReadexPro/OFL.txt

  # A single variable font file, referenced four times under one family with
  # the four weights the design calls for. Flutter's asset system just needs
  # a distinct (family, weight) pair per entry; the file bytes can repeat.
  # The wght axis (160–700, default 400) has exact named instances at all
  # four weights below — verified against the font's fvar table.
  fonts:
    - family: Readex Pro
      fonts:
        - asset: assets/fonts/ReadexPro/ReadexPro-Variable.ttf
          weight: 400
        - asset: assets/fonts/ReadexPro/ReadexPro-Variable.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro/ReadexPro-Variable.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro/ReadexPro-Variable.ttf
          weight: 700