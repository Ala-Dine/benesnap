# Static analysis configuration. See https://dart.dev/tools/analysis
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated by drift via build_runner; not hand-maintained.
    - "**/*.g.dart"
  errors:
    # Habits that bite in a long-lived app — fail the build, don't just warn.
    use_build_context_synchronously: error
    unawaited_futures: error

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
